<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f4f0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141311" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MyCloset">
  <title>MyCloset</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="back" id="back" href="#/" hidden aria-label="Volver">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </a>
      <h1 id="title" tabindex="-1">MyCloset</h1>
      <div id="top-action"></div>
    </div>
  </header>

  <main id="view" class="view"><p class="loading">Abriendo tu armario…</p></main>

  <div id="footer"></div>

  <nav class="tabbar" aria-label="Secciones">
    <a href="#/" data-tab="today">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7-4.7-1.8 4.7-1.8z"/><path d="M18.5 15l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/></svg>
      <span>Qué me pongo</span>
    </a>
    <a href="#/ropa" data-tab="wardrobe">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6a2 2 0 1 1 3 1.7c-.6.4-1 .8-1 1.5V10l8.6 5.2c1 .6.6 2.3-.6 2.3H4c-1.2 0-1.6-1.7-.6-2.3L12 10"/></svg>
      <span>Mi ropa</span>
    </a>
    <a href="#/conjuntos" data-tab="outfits">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 3 7.5l9 4.5 9-4.5z"/><path d="m3 12 9 4.5 9-4.5"/><path d="m3 16.5 9 4.5 9-4.5"/></svg>
      <span>Conjuntos</span>
    </a>
    <a href="#/ajustes" data-tab="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>
      <span>Ajustes</span>
    </a>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="dialog" class="dialog"></dialog>

  <script src="app.js"></script>
</body>
</html>
